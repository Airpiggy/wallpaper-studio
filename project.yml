name: WallpaperStudio
options:
  bundleIdPrefix: com.wallpaperstudio
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.3.1"
    CURRENT_PROJECT_VERSION: "4"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: NO

targets:
  WallpaperStudio:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/WEShim.js
        buildPhase: resources
      - path: Resources/AppIcon.icns
        buildPhase: resources
      - path: Resources/Fixtures
        type: folder
        buildPhase: resources
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleName: Wallpaper Studio
        CFBundleDisplayName: Wallpaper Studio
        CFBundleShortVersionString: "0.3.1"
        CFBundleVersion: "4"
        CFBundleIconFile: AppIcon
        LSMinimumSystemVersion: "14.0"
        LSUIElement: false
        NSHumanReadableCopyright: ""
        NSMainNibFile: ""
        NSPrincipalClass: NSApplication
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wallpaperstudio.app
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ""

  WallpaperStudioTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: WallpaperStudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wallpaperstudio.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  WallpaperStudio:
    build:
      targets:
        WallpaperStudio: all
        WallpaperStudioTests: [test]
    run:
      config: Debug
    test:
      targets:
        - WallpaperStudioTests
