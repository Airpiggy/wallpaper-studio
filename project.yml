name: WallpaperStudio
options:
  bundleIdPrefix: com.wallpaperstudio
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  fileTypes:
    icon:
      file: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.4.2"
    CURRENT_PROJECT_VERSION: "7"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: NO

targets:
  WallpaperStudio:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/WEShim.js
        buildPhase: resources
      # Sole source of the app icon. actool compiles it into Assets.car for
      # CFBundleIconName and emits a matching AppIcon.icns for CFBundleIconFile,
      # so both lookup paths get the Tahoe squircle rendering. Shipping a
      # pre-Tahoe icns alongside would reintroduce the grey backing plate on any
      # surface that happened to read it.
      - path: Resources/AppIcon.icon
        buildPhase: resources
      - path: Resources/Fixtures
        type: folder
        buildPhase: resources
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleName: Wallpaper Studio
        CFBundleDisplayName: Wallpaper Studio
        CFBundleShortVersionString: "0.4.2"
        CFBundleVersion: "7"
        CFBundleIconName: AppIcon
        LSMinimumSystemVersion: "14.0"
        LSUIElement: false
        NSHumanReadableCopyright: ""
        NSMainNibFile: ""
        NSPrincipalClass: NSApplication
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wallpaperstudio.app
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  WallpaperStudioTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: WallpaperStudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wallpaperstudio.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  WallpaperStudio:
    build:
      targets:
        WallpaperStudio: all
        WallpaperStudioTests: [test]
    run:
      config: Debug
    test:
      targets:
        - WallpaperStudioTests
